[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-vault"
version = "0.1.2"
description = "Cache Vault — a local-only clipboard vault with smart filters and sensitive auto-expiry."
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
