[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-vault"
version = "0.3.1"
description = "Cache Vault — a local-first clipboard vault with smart filters and sensitive auto-expiry."
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}

# Runtime dependencies. Kept in lockstep with requirements.txt and the
# PyInstaller hidden-imports in packaging/cache_vault.spec.
# cryptography is REQUIRED (offline Ed25519 Founder-license verification);
# licensing fails closed without it, so a fresh install must pull it here.
dependencies = [
    # Pinned exactly (lockstep with requirements.txt): the Windows wheel-scroll
    # patch relies on private CTkScrollableFrame APIs that only 6.0.0 provides.
    # See docs/CACHE_VAULT_CUSTOMTKINTER_SUPPORT_POLICY_2026-08-05.md.
    "customtkinter==6.0.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "pywin32>=306; platform_system == 'Windows'",
    "zeroconf>=0.131.0",
    "cryptography>=42.0.0",
    "pyperclip>=1.8.0",
    "qrcode>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

# Reality Gate — tiered validation control plane. Install the console command
# with `pip install -e .[dev]` (provides `reality-gate`). The `rg` name is
# deliberately NOT used: it collides with ripgrep.
[project.scripts]
reality-gate = "reality_gate.cli:main"

[tool.setuptools.packages.find]
include = ["cache_vault*", "reality_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
