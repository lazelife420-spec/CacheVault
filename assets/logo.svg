<svg width="680" height="260" viewBox="0 0 680 260" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Cache Vault logo</title>
<desc>The Cache Vault wordmark beside a dark app-icon tile showing a teal-to-cyan vault dial with a clipboard clip on top.</desc>
<style>
.wm{fill:#0f172a}.wm2{fill:#64748b}.tm{fill:#94a3b8}.tag{fill:#64748b}
@media (prefers-color-scheme:dark){.wm{fill:#f1f5f9}.wm2{fill:#94a3b8}.tm{fill:#64748b}.tag{fill:#94a3b8}}
</style>
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#10171f"/><stop offset="1" stop-color="#1d2937"/>
</linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#a7f3d0"/><stop offset="1" stop-color="#67e8f9"/>
</linearGradient>
</defs>
<rect x="40" y="30" width="200" height="200" rx="44" fill="url(#tile)"/>
<rect x="40.75" y="30.75" width="198.5" height="198.5" rx="43.25" fill="none" stroke="#34d399" stroke-opacity="0.18" stroke-width="1.5"/>
<rect x="116" y="34" width="48" height="24" rx="8" fill="url(#acc)"/>
<rect x="128" y="30" width="24" height="12" rx="4" fill="#0c1218"/>
<g stroke="url(#acc)" stroke-width="7" stroke-linecap="round">
<line x1="140" y1="130" x2="206" y2="64"/><line x1="140" y1="130" x2="74" y2="64"/>
<line x1="140" y1="130" x2="206" y2="196"/><line x1="140" y1="130" x2="74" y2="196"/>
</g>
<circle cx="206" cy="64" r="6" fill="url(#hub)"/><circle cx="74" cy="64" r="6" fill="url(#hub)"/>
<circle cx="206" cy="196" r="6" fill="url(#hub)"/><circle cx="74" cy="196" r="6" fill="url(#hub)"/>
<circle cx="140" cy="130" r="72" fill="#0c1218" fill-opacity="0.55" stroke="url(#acc)" stroke-width="9"/>
<circle cx="140" cy="130" r="46" fill="none" stroke="#34d399" stroke-opacity="0.45" stroke-width="2"/>
<g stroke="url(#hub)" stroke-width="3" stroke-linecap="round">
<line x1="140" y1="98" x2="140" y2="112"/><line x1="140" y1="148" x2="140" y2="162"/>
<line x1="108" y1="130" x2="122" y2="130"/><line x1="158" y1="130" x2="172" y2="130"/>
<line x1="117" y1="107" x2="127" y2="117"/><line x1="153" y1="143" x2="163" y2="153"/>
<line x1="163" y1="107" x2="153" y2="117"/><line x1="127" y1="143" x2="117" y2="153"/>
</g>
<circle cx="140" cy="130" r="15" fill="url(#hub)"/><circle cx="140" cy="130" r="6" fill="#0c1218"/>
<text x="272" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="600" class="wm">Cache<tspan font-weight="400" class="wm2"> Vault</tspan><tspan font-size="20" dy="-22" class="tm">™</tspan></text>
<rect x="273" y="138" width="34" height="3" rx="1.5" fill="url(#acc)"/>
<text x="316" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" class="tag">Keep the cache worth keeping.</text>
</svg>
