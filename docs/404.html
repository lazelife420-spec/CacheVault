<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bounce mistyped URLs back to the homepage after a moment. -->
  <meta http-equiv="refresh" content="4; url=/" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #f6f8fb;
      background:
        radial-gradient(circle at 18% 8%, rgba(98,212,255,.22), transparent 32rem),
        radial-gradient(circle at 82% 18%, rgba(140,255,182,.16), transparent 30rem),
        linear-gradient(180deg, #07111f 0%, #0b1220 48%, #07111f 100%);
      text-align: center; padding: 24px;
    }
    .mark {
      width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 26px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, rgba(98,212,255,.95), rgba(140,255,182,.9));
      color: #06111f; font-weight: 900; font-size: 22px;
      box-shadow: 0 16px 50px rgba(98,212,255,.28);
    }
    h1 { font-size: clamp(48px, 9vw, 96px); letter-spacing: -.06em; line-height: 1; margin: 0 0 10px; }
    p { color: #b8c2d6; font-size: 18px; margin: 0 0 28px; }
    a.button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 22px; border-radius: 14px;
      text-decoration: none; font-weight: 800; color: #06111f;
      background: linear-gradient(135deg, #62d4ff, #8cffb6);
      box-shadow: 0 18px 60px rgba(98,212,255,.22);
    }
    .hint { color: #7e8aa0; font-size: 14px; margin-top: 18px; }
  </style>
</head>
<body>
  <div>
    <div class="mark">CV</div>
    <h1>404</h1>
    <p>That page slipped out of the vault.</p>
    <a class="button" href="/">Back to Cache Vault</a>
    <p class="hint">Redirecting you home in a few seconds…</p>
  </div>
</body>
