name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    # 3.11 is intentionally excluded from the default matrix (release EXE
    # ships on 3.13; see docs/CACHE_VAULT_PYTHON_CI_GATE_UPDATE_2026-07-03.md).
    # Its runner leg has repeatedly taken 20min-1h+ vs ~2min for 3.12/3.13,
    # which stalled PR checks even when it eventually passed.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Headless self-test
        run: python app.py --selftest
