name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Opt into the Node 24 runner ahead of GitHub's June 2026 default switch, so
# checkout/setup-python stop emitting Node 20 deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The core (cache_vault.core) is GUI-free, so CI needs only pytest —
      # no customtkinter/pystray/pywin32. This also guards the "core has no
      # third-party deps" promise: if a core module grows a heavy import,
      # these jobs fail.
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Headless self-test
        run: python app.py --selftest
