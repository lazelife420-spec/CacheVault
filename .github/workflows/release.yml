name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run headless self-test
        run: python app.py --selftest

      - name: Verify assets
        run: python tools/verify_assets.py

      - name: Build packaged executable
        run: pwsh packaging/build_exe.ps1

      - name: Run packaged self-test
        run: .\dist\CacheVault.exe --selftest

      - name: Verify packaged exe metadata
        run: python tools/verify_exe_metadata.py --exe dist/CacheVault.exe

      - name: Package release artifacts
        run: pwsh packaging/package_release.ps1 -Tag $env:RELEASE_TAG

      - name: Verify release artifact structure
        run: |
          python tools/verify_release_artifact.py `
            --zip "dist/release/$env:RELEASE_TAG/CacheVault-$env:RELEASE_TAG-windows.zip" `
            --sha256 "dist/release/$env:RELEASE_TAG/SHA256SUMS.txt" `
            --tag $env:RELEASE_TAG

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $zip = "dist/release/$tag/CacheVault-$tag-windows.zip"
          $sums = "dist/release/$tag/SHA256SUMS.txt"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sums --clobber
            gh release edit $tag --title "Cache Vault $tag" --notes-file RELEASE_NOTES.md
          } else {
            gh release create $tag $zip $sums `
              --title "Cache Vault $tag" `
              --notes-file RELEASE_NOTES.md
          }
